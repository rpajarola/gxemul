# build-deb.sh adds the depends list, which dpkg-shlibdeps works out from
# the program.
name: gxemul
arch: "${ARCH}"
platform: linux
version: "${VERSION}"
section: otherosfs
priority: optional
maintainer: "Rico Pajarola <rp@servium.ch>"
homepage: "https://github.com/rpajarola/gxemul"
license: BSD-3-Clause
description: |
  Full-system emulator for MIPS, ARM, PowerPC, Motorola 88K, SuperH and
  more: DECstation, SGI, Luna 88K, Dreamcast, PlayStation 2 and other
  machines, with framebuffers on X11. This build adds SIMH tape images,
  TURBOchannel option ROMs and L2TPv3 networking.

contents:
  - src: dist/stage/usr/bin/gxemul
    dst: /usr/bin/gxemul
    file_info:
      mode: 0755
  - src: dist/stage/usr/share/man/man1/gxemul.1.gz
    dst: /usr/share/man/man1/gxemul.1.gz
  - src: dist/stage/usr/share/doc/gxemul
    dst: /usr/share/doc/gxemul
    type: tree
  - src: LICENSE
    dst: /usr/share/doc/gxemul/copyright
