# Builds packages when a release is published (or for an existing release,
# run by hand) and attaches them to the release, then has rpajarola/apt
# rebuild the apt repository and points the Homebrew formula at the
# release. See packaging/README.md for the one-time setup.
name: release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build packages for
        required: true

permissions:
  contents: write

env:
  TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  deb:
    strategy:
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libsdl2-dev zlib1g-dev dpkg-dev
          case "$(uname -m)" in
            x86_64) arch=x86_64 ;;
            aarch64) arch=arm64 ;;
          esac
          curl -fsSL "https://github.com/goreleaser/nfpm/releases/download/v2.48.0/nfpm_2.48.0_Linux_$arch.tar.gz" |
            sudo tar xzf - -C /usr/local/bin nfpm
      - name: Build
        run: VERSION="${TAG#v}" packaging/build-deb.sh
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" dist/*.deb --clobber

  pkg:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - name: Install build dependencies
        run: brew install pkgconf sdl2
      - name: Build
        run: VERSION="${TAG#v}" packaging/build-pkg.sh
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" dist/*.pkg --clobber

  win:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      # configure and the build's shell scripts need LF line endings:
      - name: Keep line endings
        shell: pwsh
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: >-
            curl
            git
            make
            zip
            mingw-w64-ucrt-x86_64-gcc
      - name: Build
        run: VERSION="${TAG#v}" packaging/build-win.sh
      - name: Attach to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" dist/*.zip --clobber

  tap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - name: Update the Homebrew formula
        env:
          TAP_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "PACKAGES_TOKEN is not set; skipping"
            exit 0
          fi
          packaging/update-tap.sh gxemul-rp "$TAG"

  apt:
    needs: deb
    runs-on: ubuntu-latest
    steps:
      - name: Have rpajarola/apt rebuild the apt repository
        env:
          GH_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "PACKAGES_TOKEN is not set; run the publish workflow in rpajarola/apt by hand"
            exit 0
          fi
          gh api repos/rpajarola/apt/dispatches -f event_type=release \
            -f "client_payload[repository]=$GITHUB_REPOSITORY" -f "client_payload[tag]=$TAG"
